name: Iran US War Tracker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iran-us-war-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Run tracker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: |
          python iran_us_tracker.py

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/classified_articles.json || true
          git add data/daily_signal.csv || true
          git add data/raw/*.json || true
          git add output/latest_report.json || true
          git add output/last_run_log.json || true
          git add output/state.json || true

          git diff --cached --quiet || git commit -m "Update tracker output"

      - name: Push changes
        run: |
          git push
